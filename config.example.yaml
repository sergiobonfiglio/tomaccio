app:
  log_level: info

download:
  label: "tomaccio"
  dir_aliases:
    movies: "/media/usb-drive/movies"
    series: "/media/usb-drive/series"
  transmission:
    url: "https://transmission.example.com/transmission/rpc"
    username: "${TRANSMISSION_USERNAME}"
    password: "${TRANSMISSION_PASSWORD}"
    download_dir: "/media/usb-drive/movies"

# search.timeout_seconds controls the overall search deadline and defaults to 120.
# search.providers is optional. If omitted, tomaccio uses default public indexers.
# Example: restrict search to a single explicit provider.
# search:
#   timeout_seconds: 120
#   providers:
#     - indexer_id: "thepiratebay"
#
# Example: configure multiple explicit providers with optional display names and overrides.
# search:
#   providers:
#     - indexer_id: "thepiratebay"
#     - name: "YTS"
#       indexer_id: "yts"
#       timeout_seconds: 10
#     - name: "LimeTorrents mirror"
#       indexer_id: "limetorrents"
#       base_url: "https://www.limetorrents.lol/"
#
# Authenticated indexers accept settings declared by their Tomagnet definition.
# Keep credentials in environment variables; never write secrets directly in config.yaml.
# search:
#   providers:
#     - name: "Private indexer"
#       indexer_id: "example"
#       settings:
#         username: "${INDEXER_USERNAME}"
#         password: "${INDEXER_PASSWORD}"
#         freeleech: "false"
#     - name: "API indexer"
#       indexer_id: "example-api"
#       settings:
#         api_key: "${INDEXER_API_KEY}"

watched:
  plex:
    url: "http://plex.example.com:32400"
    token: "${PLEX_TOKEN}"
